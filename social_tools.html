<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN Ultimate Social & Booster Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            background-attachment: fixed;
            color: #fff; 
            text-align: center; 
            padding: 30px 10px 110px 10px; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 20px; }
        
        .card { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; 
            border-radius: 24px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            text-align: left; 
            transition: 0.3s;
        }
        .card:hover { border-color: rgba(56, 189, 248, 0.6); }
        
        h1 { color: #38bdf8; font-size: 20px; margin: 10px 0 5px 0; font-weight: 700; text-align: center; }
        .title-sub { color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        
        .section-title { color: #38bdf8; font-size: 16px; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 8px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
        
        .input-field, select.input-field {
            width: 100%; padding: 12px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155;
            border-radius: 12px; color: #fff; font-family: 'Kantumruy Pro', sans-serif;
            font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            background: linear-gradient(135deg, #2563eb, #38bdf8); color: #fff; padding: 14px; 
            margin: 15px 0 5px 0; width: 100%; text-decoration: none; border-radius: 14px; 
            font-weight: bold; font-family: 'Kantumruy Pro', sans-serif; border: none; cursor: pointer; 
            transition: 0.3s; box-sizing: border-box; box-shadow: 0 4px 15px rgba(37,99,235,0.4);
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .result-box {
            margin-top: 15px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 15px; border-radius: 14px; font-size: 13px; line-height: 1.6; color: #38bdf8; display: none;
        }

        .back-btn { display: inline-block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; }
        .back-btn:hover { color: #38bdf8; }

        /* Floating Dock */
        .dsn-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 999;
        }
        .dock-item { font-size: 20px; text-decoration: none; padding: 8px; border-radius: 50%; display: flex; transition: 0.3s; }
        .dock-item:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-5px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🚀 DSN Ultimate Social & Booster Hub</h1>
            <div class="title-sub">ប្រព័ន្ធគ្រប់គ្រង និងពិសោធន៍កូដ Social Media គ្រប់បណ្តាញ (Facebook, YouTube, TikTok)</div>

            <div class="section-title">📊 Facebook / General Analytics Tool</div>
            
            <div class="input-group">
                <label>🔗 តំណភ្ជាប់ (Post / Profile URL):</label>
                <input type="text" id="fbUrl" class="input-field" placeholder="https://www.facebook.com/...">
            </div>

            <div class="input-group">
                <label>⚙️ ជ្រើសរើសសេវាកម្ម (Select Service):</label>
                <select id="fbService" class="input-field">
                    <option value="Facebook Post / Page Likes">👍 Facebook Post / Page Likes</option>
                    <option value="Facebook Followers" selected>👤 Facebook Followers</option>
                    <option value="Facebook Page Views">👁️ Facebook Page Views</option>
                    <option value="Facebook Followers Views">📈 Facebook Followers Views</option>
                </select>
            </div>

            <div class="input-group">
                <label>🔢 ចំនួនចង់បាន:</label>
                <input type="number" id="fbAmount" class="input-field" value="100000" min="100" max="1000000">
            </div>

            <button class="btn" onclick="runFacebookTool()">🚀 ដំណើរការ Facebook Tool</button>

            <div id="fbResultBox" class="result-box">
                ✅ <b>ជោគជ័យ (Facebook Simulation)!</b><br>
                🔗 <b>Link:</b> <span id="resLink">-</span><br>
                🎯 <b>ប្រភេទ:</b> <span id="resService">-</span> (<span id="resAmount">-</span>)<br>
                🚀 បានបញ្ជូនសំណើចូលប្រព័ន្ធដោយជោគជ័យ!
            </div>
        </div>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="library.html" class="dock-item" title="Library">📚</a>
        <a href="explorer.html" class="dock-item" title="File Explorer">📁</a>
        <a href="game.html" class="dock-item" title="ហ្គេម">🎮</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        function runFacebookTool() {
            const url = document.getElementById('fbUrl').value.trim();
            const service = document.getElementById('fbService').value;
            const amount = document.getElementById('fbAmount').value;
            const resultBox = document.getElementById('fbResultBox');

            if (!url) {
                alert('⚠️ សូមបញ្ចូលតំណភ្ជាប់ (URL) ជាមុនសិន!');
                return;
            }

            document.getElementById('resLink').innerText = url;
            document.getElementById('resService').innerText = service;
            document.getElementById('resAmount').innerText = Number(amount).toLocaleString();

            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
