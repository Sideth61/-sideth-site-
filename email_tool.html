<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN Email Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #090d16; color: #fff; padding: 20px; }
        .card { background: rgba(17, 24, 39, 0.85); padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        .input-field { width: 100%; padding: 12px; margin-top: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn-gen { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .output-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; white-space: pre-wrap; font-family: monospace; color: #10b981; display: none; }
        .btn-copy { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; }
        .btn-clear { width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h3>⚙️ កំណត់រចនាសម្ព័ន្ធ (Configuration)</h3>
    <label>ពាក្យគន្លឹះដំបូង (Prefix):</label>
    <input type="text" id="prefix" class="input-field" placeholder="ឧ. sanad.et">
    
    <label style="display:block; margin-top:10px;">ចំនួនដែលចង់បង្កើត (Quantity):</label>
    <input type="number" id="qty" class="input-field" value="10">

    <button class="btn-gen" onclick="generateEmailsSecure()">⚡ ចុចបង្កើត និងដាក់សោ (Generate)</button>
</div>

<div class="card" style="margin-top:20px;">
    <h3>📩 លទ្ធផល (Email & Password)</h3>
    <div id="output" class="output-box">រង់ចាំលទ្ធផល...</div>
    <button class="btn-copy" onclick="copyOutput()" style="display:none;" id="copyBtn">📋 Copy ទាំងអស់</button>
    <button class="btn-clear" onclick="clearOutput()" style="display:none;" id="clearBtn">🗑️ លុបទិន្នន័យចេញពីអេក្រង់ (Clear)</button>
</div>

<script>
    let generatedData = ""; // ទុករក្សាទុកទិន្នន័យបណ្តោះអាសន្ន

    function generateEmailsSecure() {
        // កំណត់លេខសម្ងាត់នៅទីនេាះ (បងអាចដូរតាមចិត្ត ឧ. "1234")
        const secretCode = "1234"; 
        let inputPass = prompt("🔑 បញ្ចូលលេខសម្ងាត់ដើម្បីបង្កើត និងមើលទិន្នន័យ៖");

        if (inputPass !== secretCode) {
            alert("❌ លេខសម្ងាត់ខុស! មិនអាចបង្កើតទិន្នន័យបានទេ។");
            return;
        }

        const prefix = document.getElementById('prefix').value || "user";
        const qty = parseInt(document.getElementById('qty').value);
        generatedData = "";

        for (let i = 0; i < qty; i++) {
            const randomNum = Math.floor(Math.random() * 90000) + 10000;
            const email = `${prefix}${randomNum}@gmail.com`;
            const password = Math.random().toString(36).slice(-8) + "Aa@";
            
            generatedData += `Email: ${email}\nPass:  ${password}\n-------------------------\n`;
        }

        // បង្ហាញលទ្ធផល និងប៊ូតុងផ្សេងៗ
        document.getElementById('output').innerText = generatedData;
        document.getElementById('output').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        document.getElementById('clearBtn').style.display = 'block';
        
        alert("✅ ដោះសោ និងបង្កើតគណនីជោគជ័យ!");
    }

    function copyOutput() {
        navigator.clipboard.writeText(generatedData);
        alert('បាន Copy រួចរាល់!');
    }

    function clearOutput() {
        generatedData = "";
        document.getElementById('output').innerText = "រង់ចាំលទ្ធផល...";
        document.getElementById('output').style.display = 'none';
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('clearBtn').style.display = 'none';
        alert('🗑️ បានលុបទិន្នន័យចេញពីអេក្រង់រួចរាល់ សុវត្ថិភាព!');
    }
</script>

</body>
</html>
