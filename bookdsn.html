<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទូសៀវភៅ និង Google Drive របស់ B Sideth</title>
    <style>
        body {
            font-family: 'Khmer OS Battambang', 'Khmer OS', serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .bookshelf {
            width: 80%;
            max-width: 900px;
            background-color: #795548;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .book {
            width: 100px;
            height: 150px;
            background: linear-gradient(to right, #42a5f5, #1e88e5);
            color: white;
            border-radius: 5px;
            box-shadow: -5px 5px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            text-decoration: none;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-orientation: mixed;
            position: relative;
        }

        /* ពណ៌សៀវភៅផ្សេងៗគ្នា */
        .book:nth-child(1) { background: linear-gradient(to right, #ef5350, #d32f2f); }
        .book:nth-child(2) { background: linear-gradient(to right, #66bb6a, #388e3c); }
        .book:nth-child(3) { background: linear-gradient(to right, #ffa726, #f57c00); }
        .book:nth-child(4) { background: linear-gradient(to right, #29b6f6, #0277bd); }
        .book:nth-child(5) { background: linear-gradient(to right, #ab47bc, #7b1fa2); }
        
        /* សៀវភៅភ្ជាប់ទៅ Google Drive Folder */
        .book-drive {
            background: linear-gradient(to right, #26a69a, #00796b) !important;
            border-left: 3px solid gold;
        }

        .book:hover {
            transform: scale(1.05) rotate(180deg);
            z-index: 10;
        }

        .bookshelf-title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            font-size: 2em;
            border-bottom: 2px solid #a1887f;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="bookshelf">
        <div class="bookshelf-title">បណ្ណាល័យ និង Files របស់ B Sideth 📂</div>

        <!-- សៀវភៅធម្មតា -->
        <a href="#" class="book">ក្បួនលក់អនឡាញ</a>
        <a href="#" class="book">ប្រវត្តិមហាសេដ្ឋី</a>
        <a href="#" class="book">ចិត្តវិទ្យាជោគជ័យ</a>
        <a href="#" class="book">កូដ HTML/CSS</a>

        <!-- សៀវភៅតភ្ជាប់ទៅ Google Drive Folder របស់បង -->
        <a href="https://drive.google.com/drive/folders/10rsr8yMmHySYfzTwnePyHTQwFcOUcvsI" target="_blank" class="book book-drive">Google Drive 📁</a>

    </div>

</body>
</html>
