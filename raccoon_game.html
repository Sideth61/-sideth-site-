<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccoon Game Hub - DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #090d16;
            font-family: 'Kantumruy Pro', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            z-index: 10;
        }

        .header-title {
            color: #38bdf8;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .back-btn {
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            filter: brightness(1.2);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h3 class="header-title">🦝 Raccoon Cloud Gaming</h3>
        <a href="index.html" class="back-btn">← ត្រឡប់ទៅផ្ទះ</a>
    </div>

    <div class="iframe-container">
        <!-- ហៅទំព័រ raccoongame.com មកបង្ហាញផ្ទាល់ក្នុងវេបសាយបង -->
        <iframe src="https://www.raccoongame.com/wap/dist/#/platform/cloudgame/gamedetail?gid=209" allowfullscreen></iframe>
    </div>

</body>
</html>
