<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN File Explorer - Deth DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            color: #fff; margin: 0; padding: 20px; padding-bottom: 90px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); 
            padding: 20px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
        }
        .header-title { color: #38bdf8; font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 8px; }
        
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(30, 41, 59, 0.6); padding: 12px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #334155; transition: 0.3s;
        }
        .file-item:hover { border-color: #38bdf8; }
        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-icon { font-size: 24px; }
        .file-name { font-size: 14px; font-weight: 600; color: #fff; margin: 0; }
        .file-size { font-size: 11px; color: #94a3b8; margin: 0; }
        
        .action-btn {
            padding: 6px 12px; background: #2563eb; color: #fff; border: none;
            border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .action-btn:hover { background: #38bdf8; color: #090d16; }

        .cloud-connect-card { text-align: center; }
        .connect-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff; border: none; border-radius: 12px; font-weight: bold;
            font-family: 'Kantumruy Pro', sans-serif; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .connect-btn:hover { filter: brightness(1.1); }

        /* Floating Dock */
        .dsn-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 999;
        }
        .dock-item { font-size: 20px; text-decoration: none; transition: 0.3s; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .dock-item:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- ☁️ Cloud Storage Integration Status -->
        <div class="card cloud-connect-card">
            <div class="header-title" style="justify-content: center;">🌐 Cloud & Device Storage</div>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">តភ្ជាប់ជាមួយ Google Drive, iCloud ឬ Local Storage របស់ទូរសព្ទ។</p>
            <button class="connect-btn" onclick="connectStorage()">📁 ជ្រើសរើស Folder (Connect Storage)</button>
        </div>

        <!-- 📂 File Explorer List -->
        <div class="card">
            <div class="header-title">📂 ឯកសារក្នុងប្រព័ន្ធ (Virtual Files)</div>
            
            <div class="file-item">
                <div class="file-info">
                    <div class="file-icon">🎵</div>
                    <div>
                        <p class="file-name">ទាហ៊ានមុំបី ភ្នំ750.mp3</p>
                        <p class="file-size">4.5 MB • Audio Track</p>
                    </div>
                </div>
                <button class="action-btn" onclick="openFile('ទាហ៊ានមុំបី ភ្នំ750.mp3')">ဖွင့်</button>
            </div>

            <div class="file-item">
                <div class="file-info">
                    <div class="file-icon">🎬</div>
                    <div>
                        <p class="file-name">Blaming All Men.mp4</p>
                        <p class="file-size">18.2 MB • Video Content</p>
                    </div>
                </div>
                <button class="action-btn" onclick="openFile('Blaming All Men.mp4')">មើល</button>
            </div>

            <div class="file-item">
                <div class="file-info">
                    <div class="file-icon">📝</div>
                    <div>
                        <p class="file-name">Gemini_Tutorial.txt</p>
                        <p class="file-size">12 KB • Project Note</p>
                    </div>
                </div>
                <button class="action-btn" onclick="openFile('Gemini_Tutorial.txt')">អាន</button>
            </div>
        </div>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="explorer.html" class="dock-item" title="File Explorer">📁</a>
        <a href="appstore.html" class="dock-item" title="App Store">🛒</a>
        <a href="game.html" class="dock-item" title="ហ្គេម">🎮</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        async function connectStorage() {
            try {
                if ('showDirectoryPicker' in window) {
                    const dirHandle = await window.showDirectoryPicker();
                    alert('✅ បានតភ្ជាប់ជាមួយ Folder ក្នុង Storage/Cloud ដោយជោគជ័យ!');
                } else {
                    alert('⚠️ Browser មិនទាន់គាំទ្រ Directory Picker ផ្ទាល់ទេ ប៉ុន្តែ Virtual File System កំពុងដំណើរការធម្មតា។');
                }
            } catch (err) {
                alert('⚠️ បានបោះបង់ការតភ្ជាប់ Folder។');
            }
        }

        function openFile(fileName) {
            alert(`📂 កំពុងបើកឯកសារ: "${fileName}" ក្នុងប្រព័ន្ធ DSN OS...`);
        }
    </script>
</body>
</html>
