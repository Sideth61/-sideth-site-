<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library DSN - San Sideth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: #090d16; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%), 
                radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, #090d16, #020617);
            background-attachment: fixed;
            background-size: cover;
            color: #fff; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); padding: 20px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); text-align: left; }
        .title { color: #38bdf8; font-size: 18px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 8px; }
        
        .song-item { 
            background: rgba(30, 41, 59, 0.7); 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-bottom: 8px; 
            transition: 0.3s; 
            font-size: 14px;
            color: #94a3b8;
            border: 1px solid transparent;
        }
        .song-item:hover { background: rgba(56, 189, 248, 0.1); color: #fff; border-color: rgba(56, 189, 248, 0.4); }
        .song-item.active { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); font-weight: 600; }

        .btn-back { display: block; text-align: center; padding: 14px; background: #4b5563; color: white; text-decoration: none; border-radius: 14px; font-weight: 600; font-family: 'Kantumruy Pro', sans-serif; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="title">📚 Library DSN & MP3 Player</div>
        <p>អានឯកសារសៀវភៅ IT និងស្តាប់កម្សាន្តបទចម្រៀង Original របស់ B Sideth❤️️ ផ្ទាល់នៅទីនេះ!</p>
        
        <audio id="audioPlayer" controls style="width: 100%; margin: 15px 0 10px 0; accent-color: #38bdf8;"></audio>
        
        <div id="playlist" class="playlist"></div>
    </div>

    <!-- ប៊ូតុងត្រឡប់ទៅទំព័រដើម -->
    <a href="index.html" class="btn-back">⬅️ ត្រឡប់ទៅទំព័រដើមវិញ (Home)</a>
</div>

<script>
    const songs = [
        { title: "🎖️ ទាហ៊ានមុំបី ភ្នំ750", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { title: "💔 Blaming All Men", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
    ];
    
    const audio = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    let activeItem = null;

    songs.forEach((song, index) => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerText = song.title;
        div.onclick = () => {
            audio.src = song.src;
            audio.play();
            
            // ដូរពណ៌highlight បទដែលកំពុងលេង
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
        };
        playlist.appendChild(div);
    });

    // ដើរស្វ័យប្រវត្តិបទដំបូងពេលបើកចូល
    if(songs.length > 0) {
        audio.src = songs[0].src;
    }
</script>

</body>
</html>
