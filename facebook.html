<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Facebook - DSN Security</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap');
        
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: linear-gradient(135deg, #1e0529, #4a0e5c, #1e0529);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: white;
        }

        h2 { margin-bottom: 25px; color: #e9d5ff; }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        input::placeholder { color: #d8b4fe; }

        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            color: white;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover { transform: scale(1.02); filter: brightness(1.2); }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #d8b4fe;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>📘 Facebook Login</h2>
        <input type="text" placeholder="លេខទូរស័ព្ទ ឬអ៊ីមែល">
        <input type="password" placeholder="ពាក្យសម្ងាត់">
        <button class="login-btn" onclick="alert('ប្រព័ន្ធកំពុងដំណើរការ!')">ចូល (Log In)</button>
        <a href="index.html" class="back-link">← ត្រឡប់ទៅផ្ទះវិញ</a>
    </div>

</body>
</html>
