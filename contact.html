<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Feedback - Deth DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body.theme-dark { background-color: #090d16; color: #fff; }
        body.theme-cyber { background-color: #12001c; color: #ff77ff; }
        body.theme-ocean { background-color: #001e2b; color: #76ff03; }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            background-attachment: fixed;
            color: #fff; margin: 0; padding: 20px; 
            padding-bottom: 90px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            position: relative;
        }

        #effectCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .card { 
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); 
            padding: 25px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); text-align: left;
        }
        .title { color: #38bdf8; font-size: 18px; font-weight: 700; margin-bottom: 15px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 5px; }
        .input-field {
            width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #334155;
            border-radius: 10px; color: #fff; font-family: 'Kantumruy Pro', sans-serif;
            font-size: 13px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff; border: none; border-radius: 12px; font-weight: bold;
            font-family: 'Kantumruy Pro', sans-serif; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .back-btn { 
            display: block; text-align: center; background: #1e293b; border: 1px solid #334155;
            color: #fff; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .back-btn:hover { background: #334155; }

        /* Floating Dock ផ្នែកខាងក្រោម */
        .dsn-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 999;
        }
        .dock-item {
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dock-item:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="theme-dark">

    <canvas id="effectCanvas"></canvas>

    <div class="container">
        <div class="card">
            <div class="title">📬 ទំនាក់ទំនង និងផ្ើសារមកកាន់ B Sideth</div>
            <div class="input-group">
                <label>ឈ្មោះរបស់អ្នក (Your Name):</label>
                <input type="text" id="senderName" class="input-field" placeholder="បញ្ចូលឈ្មោះរបស់អ្នក...">
            </div>
            <div class="input-group">
                <label>សារ ឬមតិយោបល់ (Your Message):</label>
                <textarea id="senderMsg" class="input-field" rows="4" placeholder="សរសេរមតិ ឬសំណូមពរទីនេះ..."></textarea>
            </div>
            <button class="btn" onclick="sendMessage()">🚀 ផ្ញើសារឥឡូវនេះ (Send)</button>
        </div>
        <a href="index.html" class="back-btn">⬅️ ត្រឡប់ទៅទំព័រដើម (Home)</a>
    </div>

    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="profile.html" class="dock-item" title="ប្រវត្តិរូប">👤</a>
        <a href="appstore.html" class="dock-item" title="App Store">🛒</a>
        <a href="game.html" class="dock-item" title="ហ្គេម">🎮</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        function sendMessage() {
            const name = document.getElementById('senderName').value;
            const msg = document.getElementById('senderMsg').value;

            if(!name || !msg) {
                alert('⚠️ សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់ជាមុនសិន!');
                return;
            }

            alert('✅ អរគុណច្រើន ' + name + '! សាររបស់អ្នកត្រូវបានបញ្ជូនទៅកាន់ B Sideth ដោយជោគជ័យហើយ!');
            document.getElementById('senderName').value = '';
            document.getElementById('senderMsg').value = '';
        }

        /* Canvas Effects & Theme Loader */
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let currentEffect = 'none';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initParticles(type) {
            currentEffect = type;
            particles = [];
            if (type === 'none') return;

            let count = type === 'rain' ? 80 : 50;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: type === 'rain' ? Math.random() * 5 + 4 : Math.random() * 0.5 + 0.2,
                    length: type === 'rain' ? Math.random() * 20 + 10 : Math.random() * 3 + 1,
                    radius: type === 'stars' ? Math.random() * 2 + 1 : 0,
                    opacity: Math.random() * 0.7 + 0.3
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (currentEffect !== 'none') {
                ctx.lineWidth = 1.5;
                particles.forEach(p => {
                    ctx.beginPath();
                    if (currentEffect === 'rain') {
                        ctx.strokeStyle = `rgba(56, 189, 248, ${p.opacity})`;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p.x - 1, p.y + p.length);
                        ctx.stroke();
                        p.y += p.speed;
                        p.x -= 0.5;
                        if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
                    } else if (currentEffect === 'stars') {
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fill();
                        p.y += p.speed;
                        if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
                    }
                });
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dsn_theme') || 'theme-dark';
            document.body.className = savedTheme;

            const savedEffect = localStorage.getItem('dsn_effect') || 'none';
            initParticles(savedEffect);
        });
    </script>
</body>
</html>
