<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>DSN Security & Password Analyzer</title>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background: #090d16; color: #fff; padding: 20px; text-align: center; }
        .box { background: #111827; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-field { width: 100%; padding: 12px; margin: 15px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        .strength-meter { height: 8px; width: 100%; background: #334155; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: 0.3s; }
        #result { font-weight: bold; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛡️ DSN Password Security Analyzer</h2>
        <p style="color: #94a3b8; font-size: 13px;">ពិនិត្យមើលថាតើ Password ណាមួយងាយស្រួល ឬពិបាកក្នុងការ Hack!</p>
        
        <input type="text" id="pwdInput" class="input-field" placeholder="បញ្ចូល Password ដើម្បីឆែក..." oninput="checkPassword()">
        
        <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
        </div>
        
        <div id="result">សូមបញ្ចូល Password...</div>
    </div>

    <script>
        function checkPassword() {
            let pwd = document.getElementById('pwdInput').value;
            let bar = document.getElementById('strengthBar');
            let res = document.getElementById('result');
            
            let strength = 0;
            if (pwd.length === 0) {
                bar.style.width = "0%";
                res.innerHTML = "សូមបញ្ចូល Password...";
                res.style.color = "#94a3b8";
                return;
            }

            if (pwd.length >= 8) strength++;
            if (/[A-Z]/.test(pwd)) strength++;
            if (/[0-9]/.test(pwd)) strength++;
            if (/[^A-Za-z0-9]/.test(pwd)) strength++;

            if (strength === 1) {
                bar.style.width = "25%";
                bar.style.background = "#ef4444";
                res.innerHTML = "⚠️ ខ្សោយខ្លាំង (ងាយនឹងត្រូវ Hack ក្នុងរយៈពេលប៉ុន្មានវិនាទី!)";
                res.style.color = "#ef4444";
            } else if (strength === 2 || strength === 3) {
                bar.style.width = "65%";
                bar.style.background = "#f59e0b";
                res.innerHTML = "⚡ មធ្យម (គួរតែបន្ថែមអក្សរធំ ឬនិមិត្តសញ្ញា)";
                res.style.color = "#f59e0b";
            } else if (strength === 4) {
                bar.style.width = "100%";
                bar.style.background = "#10b981";
                res.innerHTML = "🔒 រឹងមាំខ្លាំង (សុវត្ថិភាពខ្ពស់ ពិបាក Hack បំផុត!)";
                res.style.color = "#10b981";
            }
        }
    </script>
</body>
</html>
