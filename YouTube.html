<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Sideth - DSN Exclusive Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: #090d16; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%), 
                radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, #090d16, #020617);
            background-attachment: fixed;
            background-size: cover;
            color: #fff; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden; /* មិនឱ្យមាន Scrollbar រញ៉េរញ៉ៃ */
        }
        .card { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px); 
            padding: 30px 20px; 
            border-radius: 24px; 
            border: 1px solid rgba(56, 189, 248, 0.4); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); 
            text-align: center; 
            width: 100%; 
            max-width: 450px; 
        }
        .avatar { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 15px auto; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #38bdf8, #f43f5e); 
            padding: 3px; 
        }
        .avatar img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            display: block; 
            border: 2px solid #090d16; 
        }
        h1 { color: #38bdf8; font-size: 22px; margin: 10px 0 5px 0; font-weight: 700; }
        .title-sub { color: #f43f5e; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        
        .btn-youtube { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 14px; 
            background: #ff0000; 
            color: #fff; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 600; 
            box-sizing: border-box; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
        .btn-youtube:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">
            <img src="IMG_3350.jpeg" alt="San Sideth Logo">
        </div>
        <h1>San Sideth - DSN Official</h1>
        <div class="title-sub">⚔️ មន្ត្រីយោធាជួរមុខ & Content Creator 💻</div>
        
        <p>សូមស្វាគមន៍មកកាន់ទំព័រផ្លូវការរបស់ខ្ញុំ! ទីនេះគឺជារបៀបបង្ហាញស្នាដៃ និងឆាណែល YouTube ផ្ទាល់ខ្លួនរបស់ B Sideth❤️️។</p>

        <!-- Link ទៅកាន់ YouTube Channel របស់បង -->
        <a href="https://www.youtube.com/@sideth99" target="_blank" class="btn-youtube">
            ▶️ ចូលទស្សនា YouTube Channel (@sideth99)
        </a>
    </div>

    <script>
        // បច្ចេកទេស Block ប៊ូតុង ថយក្រោយ (Back) និង ទៅមុខ (Forward) របស់ Browser
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>

</body>
</html>
ប្រភព៖ YouTube
