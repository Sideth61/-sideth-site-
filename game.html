<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; background: #090d16; color: #fff; padding: 20px; text-align: center; margin: 0; padding-bottom: 90px; }
        .container { max-width: 500px; margin: auto; background: rgba(17, 24, 39, 0.9); padding: 25px; border-radius: 20px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; text-align: center; }
        .game-card { background: #1e293b; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .game-title { font-weight: bold; color: #fff; font-size: 16px; }
        .btn-play { background: #2563eb; color: #fff; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .btn-play:hover { background: #1d4ed8; }
        .btn-download { background: #10b981; color: #fff; padding: 12px; display: block; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .btn-download:hover { background: #059669; }
        .btn-back { display: block; text-align: center; background: #334155; color: #fff; padding: 10px; margin-top: 10px; text-decoration: none; border-radius: 10px; font-size: 14px; }
        .btn-back:hover { background: #475569; }

        /* Floating Dock */
        .dsn-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 999;
        }
        .dock-item { font-size: 20px; text-decoration: none; padding: 8px; border-radius: 50%; display: flex; transition: 0.3s; }
        .dock-item:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 DSN Game Hub</h2>
        <p>ជ្រើសរើសហ្គេមដែលបងចង់លេង ឬទាញយកឯកសារហ្គេមពី Google Drive!</p>
        
        <div class="game-card">
            <span class="game-title">🚗 Grand Theft Auto (GTA)</span>
            <a href="gta.html" class="btn-play">ចូលមើល</a>
        </div>

        <div class="game-card">
            <span class="game-title">🔫 Call of Duty</span>
            <a href="call_of_duty.html" class="btn-play">ចូលមើល</a>
        </div>

        <!-- ឯកសារហ្គេមពី Google Drive របស់បង -->
        <a href="https://drive.google.com/file/d/0B5JtcY9bqji2Y2RsdlhQZXY2Q1k/view?usp=drivesdk&resourcekey=0-J5-WYZXLhfoqqM2hnLeL9Q" target="_blank" class="btn-download">📥 ទាញយកឯកសារហ្គេម (Google Drive)</a>

        <a href="index.html" class="btn-back">🏠 ត្រឡប់ទៅ DSN OS វិញ</a>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="game.html" class="dock-item" title="Games" style="background: rgba(56, 189, 248, 0.2); border-radius: 50%;">🎮</a>
        <a href="facebook.html" class="dock-item" title="ហ្វេសប៊ុក">📘</a>
        <a href="money_tool.html" class="dock-item" title="Money Tool">💰</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>
</body>
</html>
