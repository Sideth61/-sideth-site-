<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Library DSN</title>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #090d16; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: rgba(17, 24, 39, 0.85); padding: 20px; border-radius: 20px; border: 1px solid #38bdf8; width: 100%; max-width: 400px; }
        .song-item { background: #1e293b; padding: 10px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; }
        .btn-back { display: block; margin-top: 20px; text-decoration: none; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div style="color: #38bdf8; font-weight: bold; margin-bottom: 10px;">🎧 DSN MP3 Player</div>
        <audio id="audioPlayer" controls style="width: 100%;"></audio>
        <div id="playlist" style="margin-top: 15px;"></div>
    </div>
    <a href="index.html" class="btn-back">⬅️ ត្រឡប់ទៅផ្ទះ</a>
    <script>
        const songs = [
            { title: "🎖️ ទាហ៊ានមុំបី ភ្នំ750", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "💔 Blaming All Men", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];
        const audio = document.getElementById('audioPlayer');
        songs.forEach(song => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerText = song.title;
            div.onclick = () => { audio.src = song.src; audio.play(); };
            document.getElementById('playlist').appendChild(div);
        });
    </script>
</body>
</html>
