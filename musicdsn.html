<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music DSN - San Sideth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: #090d16; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%), 
                radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, #090d16, #020617);
            background-attachment: fixed;
            background-size: cover;
            color: #fff; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); padding: 20px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); text-align: left; }
        .title { color: #38bdf8; font-size: 18px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 8px; }
        
        /* ផ្នែក YouTube Video Embed បង្កប់ក្នុង Web 100% មិនឱ្យលោតចេញក្រៅ */
        .video-container { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; 
            height: 0; 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            background: #000;
        }
        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
            border-radius: 12px; 
        }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: #2563eb; text-align: center; color: #fff; border-radius: 14px; text-decoration: none; font-weight: 600; box-sizing: border-box; margin-top: 10px; }
        .btn-youtube { background: #ff0000; }
        .btn-back { background: #4b5563; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ផ្នែក Music DSN & YouTube Channel -->
        <div class="card">
            <div class="title">🎵 Deth DSN - YouTube Channel (@sideth99)</div>
            <p>ទស្សនាស្នាដៃវីដេអូមើលកម្សាន្ត និងបទចម្រៀង AI របស់ B Sideth❤️️ ផ្ទាល់ក្នុងវេបសាយដោយមិនបាច់លោតចូល App ក្រៅឡើយ!</p>
            
            <div class="video-container">
                <!-- បន្ថែម Parameter រារាំងការលោតចេញក្រៅ -->
                <iframe src="https://www.youtube.com/embed/Ra8mVoAwNfU?modestbranding=1&rel=0&playsinline=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>

            <a href="https://www.youtube.com/@sideth99" target="_blank" class="btn btn-youtube">▶️ មើលឆាណែល YouTube ផ្លូវការ (@sideth99)</a>
        </div>

        <!-- ប៊ូតុងត្រឡប់ក្រោយទៅ library.html ឬ index.html -->
        <div class="card" style="padding: 15px; text-align: center;">
            <a href="library.html" class="btn btn-back">⬅️ ត្រឡប់ទៅបណ្ណាល័យវិញ (Library)</a>
        </div>
    </div>

</body>
</html>
