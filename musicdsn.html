<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library DSN - Deth DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 90px; /* ເວ້ນໄລຍະໃຫ້ Dock ພາກສ່ວນខាងລຸ່ມ */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .card { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
        }

        .player-title { 
            color: #38bdf8; 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .song-item { 
            background: rgba(30, 41, 59, 0.6); 
            padding: 12px; 
            margin-bottom: 8px; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 1px solid #334155;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .song-item:hover { 
            border-color: #38bdf8; 
            background: rgba(56, 189, 248, 0.1); 
        }

        .browser-link { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: linear-gradient(135deg, #4ecca3, #0f3460); 
            color: #fff; 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: 600; 
            border: 1px solid #4ecca3; 
            transition: 0.3s;
        }
        .browser-link:hover { filter: brightness(1.1); }

        .btn-back { 
            display: block; 
            text-align: center; 
            margin-top: 5px; 
            text-decoration: none; 
            color: #94a3b8; 
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-back:hover { color: #fff; }

        /* Floating Dock ផ្នែកខាងក្រោម */
        .dsn-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 999;
        }
        .dock-item {
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dock-item:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="player-title">🎧 DSN MP3 Player</div>
            <audio id="audioPlayer" controls style="width: 100%; border-radius: 8px;"></audio>
            <div id="playlist" style="margin-top: 15px;"></div>
        </div>

        <a href="browse.html" class="browser-link">🌐 បើកប្រើប្រាស់ Mini Browser</a>
        <a href="index.html" class="btn-back">⬅️ ត្រឡប់ទៅផ្ទះ</a>
    </div>

    <!-- Floating Dock ផ្នែកខាងក្រោម -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="profile.html" class="dock-item" title="ប្រវត្តិរូប">👤</a>
        <a href="appstore.html" class="dock-item" title="App Store">🛒</a>
        <a href="game.html" class="dock-item" title="ហ្គេម">🎮</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        const songs = [
            { title: "🎖️ ទាហ៊ានមុំបី ភ្នំ750", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "💔 Blaming All Men", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];
        const audio = document.getElementById('audioPlayer');
        songs.forEach(song => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerText = song.title;
            div.onclick = () => { audio.src = song.src; audio.play(); };
            document.getElementById('playlist').appendChild(div);
        });
    </script>
</body>
</html>
