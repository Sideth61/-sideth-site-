<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library DSN - Deth DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            background-attachment: fixed;
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 100px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .card { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(236, 72, 153, 0.4); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
        }

        .player-title { 
            color: #ec4899; 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .song-item { 
            background: rgba(30, 41, 59, 0.6); 
            padding: 12px; 
            margin-bottom: 8px; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 1px solid #334155;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .song-item:hover { 
            border-color: #ec4899; 
            background: rgba(236, 72, 153, 0.15); 
            transform: translateY(-2px);
        }

        .browser-link { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: linear-gradient(135deg, #4ecca3, #0f3460); 
            color: #fff; 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: 600; 
            border: 1px solid #4ecca3; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(78,204,163,0.3);
        }
        .browser-link:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .btn-back { 
            display: block; 
            text-align: center; 
            margin-top: 5px; 
            text-decoration: none; 
            color: #94a3b8; 
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-back:hover { color: #fff; }

        /* Floating Dock */
        .dsn-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56,189,248,0.2);
            z-index: 999;
        }
        .dock-item {
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dock-item:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-5px) scale(1.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="player-title">🎧 DSN Music & Audio Visualizer Hub</div>
            <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 12px; text-align: center;">ស្ដាប់កម្សាន្តបញ្ជីបទចម្រៀងរបស់បង៖</p>
            
            <audio id="audioPlayer" controls style="width: 100%; border-radius: 8px; margin-bottom: 15px;"></audio>
            
            <!-- Playlist នឹងត្រូវបង្កើតស្វ័យប្រវត្តិតាម JavaScript -->
            <div id="playlist"></div>
        </div>

        <a href="browser.html" class="browser-link">🌐 បើកប្រើប្រាស់ Mini Browser</a>
        <a href="index.html" class="btn-back">⬅️ ត្រឡប់ទៅផ្ទះ</a>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="profile.html" class="dock-item" title="ប្រវត្តិរូប">👤</a>
        <a href="appstore.html" class="dock-item" title="App Store">🛒</a>
        <a href="library.html" class="dock-item" title="Library DSN" style="color: #ec4899;">📚</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        // 🎶 បញ្ជីបទចម្រៀងរបស់ B Sideth
        const songs = [
            { title: "បទ៖ ទាហានមុំបី ភ្នំ750", id: "1K41ZSpc26GlRm3Vm-m3UPceRomH1KcGS" },
            { title: "បទ៖ Blame You Too", id: "10-PzHDJcyerQsqaRrAGLcuerUPOPIcfl" },
            { title: "Blaming All Men English", id: "1lVFI6bFLkBzUXTDdwRe0jvcA0j3aaCd-" },
            { title: "បទ៖ ប៉ៃលិន ខ្ញុំមិនដែលភ្លេចអ្នកទេ", id: "1OP42EERj_uyEUAlJ7t7MEVgoBAMLA3EY" }
        ];

        const audio = document.getElementById('audioPlayer');
        const playlist = document.getElementById('playlist');

        songs.forEach((song, index) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerHTML = `🎵 <span>${index + 1}. ${song.title}</span>`;
            
            div.onclick = () => { 
                // ដូរពណ៌ active song item
                document.querySelectorAll('.song-item').forEach(item => {
                    item.style.borderColor = '#334155';
                    item.style.background = 'rgba(30, 41, 59, 0.6)';
                });
                div.style.borderColor = '#ec4899';
                div.style.background = 'rgba(236, 72, 153, 0.2)';

                // แปลง Google Drive Link ឲ្យទៅជា Direct Stream URL ត្រឹមត្រូវ
                audio.src = `https://docs.google.com/uc?export=download&id=${song.id}`;
                audio.play().catch(err => {
                    alert('⚠️ មិនអាចចាក់បទចម្រៀងនេះបានទេ។ សូមពិនិត្យមើលសិទ្ធិ 공유 (Sharing) របស់ Google Drive ជា Public ជាមុនសិន!');
                });
            };
            playlist.appendChild(div);
        });
    </script>
</body>
</html>
