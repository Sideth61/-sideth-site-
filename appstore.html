<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN App Store - Deth DSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 100px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            background-attachment: fixed;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .header-title { 
            color: #38bdf8; 
            font-size: 22px; 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 10px; 
            text-shadow: 0 0 15px rgba(56,189,248,0.4);
        }

        .card { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            transition: 0.3s ease;
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }

        .app-info h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 16px; }
        .app-info p { margin: 0; color: #94a3b8; font-size: 12px; }

        .install-btn {
            padding: 8px 18px; 
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold;
            font-family: 'Kantumruy Pro', sans-serif; 
            cursor: pointer; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
        }

        .install-btn:hover { 
            filter: brightness(1.1); 
            transform: scale(1.05);
        }

        .install-btn.installed {
            background: linear-gradient(135deg, #059669, #34d399);
            box-shadow: 0 4px 15px rgba(5,150,105,0.4);
            cursor: default;
        }

        /* Floating Dock */
        .dsn-dock {
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); 
            padding: 10px 20px; 
            border-radius: 30px;
            display: flex; 
            gap: 15px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56,189,248,0.2); 
            z-index: 999;
        }

        .dock-item { 
            font-size: 20px; 
            text-decoration: none; 
            transition: 0.3s; 
            padding: 8px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .dock-item:hover { 
            background: rgba(56, 189, 248, 0.2); 
            transform: translateY(-5px) scale(1.1); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">🛒 DSN App Store</div>
        
        <!-- App 1 -->
        <div class="card">
            <div class="app-info">
                <h3>🎵 DSN Music Player</h3>
                <p>កម្មវិធីស្ដាប់ចម្រៀង AI ក្នុង OS</p>
            </div>
            <button class="install-btn" id="btn-music" onclick="installApp('DSN Music Player', 'btn-music')">Install</button>
        </div>

        <!-- App 2 -->
        <div class="card">
            <div class="app-info">
                <h3>🎮 Lucky Game Hub</h3>
                <p>កន្លែងកម្សាន្តហ្គេមសប្បាយៗ</p>
            </div>
            <button class="install-btn" id="btn-game" onclick="installApp('Lucky Game Hub', 'btn-game')">Install</button>
        </div>

        <!-- App 3 -->
        <div class="card">
            <div class="app-info">
                <h3>📁 DSN Cloud Explorer</h3>
                <p>គ្រប់គ្រងឯកសារលើ iCloud/Drive</p>
            </div>
            <button class="install-btn" id="btn-cloud" onclick="installApp('DSN Cloud Explorer', 'btn-cloud')">Install</button>
        </div>

        <!-- App 4 (បន្ថែមថ្មី بۆ Browser) -->
        <div class="card">
            <div class="app-info">
                <h3>🌐 B Sideth Mini Browser</h3>
                <p>កម្មវិធីរុករកវិបសាយផ្ទាល់ខ្លួន</p>
            </div>
            <button class="install-btn" id="btn-browser" onclick="installApp('B Sideth Mini Browser', 'btn-browser')">Install</button>
        </div>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="profile.html" class="dock-item" title="ប្រវត្តិរូប">👤</a>
        <a href="appstore.html" class="dock-item" title="App Store" style="color: #38bdf8;">🛒</a>
        <a href="library.html" class="dock-item" title="Library DSN">📚</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        // ពិនិត្យមើលស្ថានភាព App ដែលបាន Install រួចពេលបើក Page
        window.onload = function() {
            const apps = ['DSN Music Player', 'Lucky Game Hub', 'DSN Cloud Explorer', 'B Sideth Mini Browser'];
            apps.forEach(appName => {
                if (localStorage.getItem(`installed_${appName}`) === 'true') {
                    const btnId = getBtnId(appName);
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        btn.textContent = 'Installed';
                        btn.classList.add('installed');
                    }
                }
            });
        };

        function getBtnId(appName) {
            if (appName.includes('Music')) return 'btn-music';
            if (appName.includes('Game')) return 'btn-game';
            if (appName.includes('Cloud')) return 'btn-cloud';
            if (appName.includes('Browser')) return 'btn-browser';
            return '';
        }

        async function installApp(appName, btnId) {
            const btn = document.getElementById(btnId);
            try {
                if ('showDirectoryPicker' in window) {
                    await window.showDirectoryPicker();
                }
                localStorage.setItem(`installed_${appName}`, 'true');
                btn.textContent = 'Installed';
                btn.classList.add('installed');
                alert(`✅ បានដំឡើងកម្មវិធី "${appName}" ចូលទៅកាន់ប្រព័ន្ធ DSN OS ជោគជ័យហើយ!`);
            } catch (err) {
                // ប្រសិនបើ User Cancel Directory Picker ក៏រក្សាទុកក្នុង VFS ដែរ
                localStorage.setItem(`installed_${appName}`, 'true');
                btn.textContent = 'Installed';
                btn.classList.add('installed');
                alert(`✅ បានដំឡើងកម្មវិធី "${appName}" រួចរាល់ (រក្សាទុកក្នុង VFS Storage)!`);
            }
        }
    </script>
</body>
</html>
