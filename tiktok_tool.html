<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN TikTok US Strategy & Checklist</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; background: #090d16; color: #fff; padding: 20px; text-align: center; margin: 0; }
        .box { background: rgba(17, 24, 39, 0.9); padding: 25px; border-radius: 20px; max-width: 500px; margin: auto; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        p, li { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        ul { padding-left: 20px; }
        .checklist-item { background: #1e293b; padding: 12px; border-radius: 10px; margin: 10px 0; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid #334155; }
        .checklist-item input { width: 18px; height: 18px; cursor: pointer; }
        .btn-back { display: block; text-align: center; background: #2563eb; color: #fff; padding: 12px; margin-top: 20px; text-decoration: none; border-radius: 10px; font-weight: bold; }
        .btn-back:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🇺🇸 DSN TikTok US Setup Guide</h2>
        <p>ពិនិត្យមើលបញ្ជីខាងក្រោមមុនពេលបង្កើត ឬផុសវីដេអូ TikTok ទីផ្សារសហរដ្ឋអាមេរិក (US):</p>
        
        <div class="checklist-item">
            <input type="checkbox" id="check1">
            <label for="check1"><b>ដកស៊ីមកាតចេញ (No SIM Card):</b> ប្រើទូរសព្ទដែលគ្មានស៊ីមកាតស្រុកខ្មែរ ដើម្បីការពារកុំឱ្យ TikTok ចាប់តំបន់។</label>
        </div>

        <div class="checklist-item">
            <input type="checkbox" id="check2">
            <label for="check2"><b>ប្តូរតំបន់ទូរសព្ទ (Region & Language):</b> កំណត់ Region ទៅ US និងភាសាជា English ក្នុង Settings ទូរសព្ទ។</label>
        </div>

        <div class="checklist-item">
            <input type="checkbox" id="check3">
            <label for="check3"><b>បិទ GPS / Location Services:</b> បិទមិនឱ្យ TikTok ដឹងទីតាំងពិតប្រាកដរបស់អ្នក។</label>
        </div>

        <div class="checklist-item">
            <input type="checkbox" id="check4">
            <label for="check4"><b>ចំណាយពេល Warm-up ៣ថ្ងៃ៖</b> អូសមើលវីដេអូ Like និង Comment លើ Trend US មុននឹងបង្កើត አካោន ឬផុសវីដេអូដំបូង។</label>
        </div>

        <a href="index.html" class="btn-back">🏠 ត្រឡប់ទៅ DSN OS វិញ</a>
    </div>
</body>
</html>
